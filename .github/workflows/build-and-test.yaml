name: Build and test

on:
    workflow_call:
        inputs:
            node-version:
                description: Node.js version to run with.
                type: string
                default: "24"
            playwright-browsers:
                description: Playwright browsers to install, separated by spaces, for example "chromium". Empty installs none.
                type: string
                default: ""
            size-script:
                description: Name of a package.json script to run after the tests, for example a size budget check. Empty runs none.
                type: string
                default: ""
            github-packages:
                description: Install the owner's scoped packages from GitHub Packages. Needs packages read.
                type: boolean
                default: false

permissions: {}

jobs:
    build-and-test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: read
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: pnpm
                  registry-url: ${{ inputs.github-packages && 'https://npm.pkg.github.com' || '' }}
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  NODE_AUTH_TOKEN: ${{ inputs.github-packages && github.token || '' }}
            - name: Install Playwright browsers
              if: inputs.playwright-browsers != ''
              run: |
                  read -ra browsers <<< "$PLAYWRIGHT_BROWSERS"
                  pnpm exec playwright install --with-deps "${browsers[@]}"
              env:
                  PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
            - name: Build
              run: pnpm run build
            - name: Type check
              run: pnpm run typecheck
            - name: Lint
              run: pnpm run lint
            - name: Check formatting
              run: pnpm run format
            - name: Test
              run: pnpm run test
            - name: Run size script
              if: inputs.size-script != ''
              run: pnpm run "$SIZE_SCRIPT"
              env:
                  SIZE_SCRIPT: ${{ inputs.size-script }}
